<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha técnica {{ clave }}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f7f8fa; color: #313a4a; }
    #estado { padding: 24px; font: 14px sans-serif; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="estado" role="status">Preparando ficha técnica…</div>
  <!-- Mismo motor vectorial, fuentes y marca que Descargar ficha en la web.
       Recursos embebidos: el HTML y PDF funcionan sin Google Fonts ni CDN. -->
  <script>{{ pdf_lib | safe }}</script>
  <script>{{ fontkit | safe }}</script>
  <script>{{ engine | safe }}</script>
  <script type="application/json" id="ficha-input">{{ payload | safe }}</script>
  <script>
    const input = JSON.parse(document.getElementById('ficha-input').textContent);
    const decode = (value) => Uint8Array.from(atob(value), c => c.charCodeAt(0));
    window.fichaReady = (async () => {
      const resources = Object.fromEntries(Object.entries(input.resources).map(([name, value]) =>
        [name, name === 'logoPng' ? value : decode(value)]));
      if (input.generatedAt) resources.generatedAt = new Date(input.generatedAt);
      const pdf = await FichaPdf.generarFichaPdf(input.obra, resources);
      const url = URL.createObjectURL(new Blob([pdf], {type: 'application/pdf'}));
      const frame = document.createElement('iframe');
      frame.title = 'Ficha técnica ' + input.obra.proy_clave;
      frame.src = url;
      document.getElementById('estado').replaceWith(frame);
      return pdf;
    })();
    window.fichaReady.catch(error => {
      document.getElementById('estado').textContent = 'No fue posible generar la ficha: ' + error.message;
    });
    window.fichaBase64 = async () => {
      const bytes = await window.fichaReady;
      let binary = '';
      for (let i = 0; i < bytes.length; i += 8192) binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
      return btoa(binary);
    };
  </script>
</body>
</html>
